# Publishes the smartphone app (mobile/, static code only, never data) on GitHub Pages:
# https://cricci3.github.io/myWealth/ (SPEC §16.2). Repository settings > Pages > Source
# must be "GitHub Actions".
name: Smartphone app on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the app (offline cache, no external resources, crypto vectors)
        run: node --test tests/js/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
