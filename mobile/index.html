<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- No network calls after loading: only this site's own files, no external resources. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob: mediastream:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Registra spese, entrate e trasferimenti per myWealth, anche offline.">
  <title>myWealth</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="update" id="update" hidden>
    <span>Aggiornamento disponibile</span>
    <button type="button" class="btn btn-sm" id="btn-update">Aggiorna</button>
  </div>

  <header class="top">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17l5-5 3.5 3.5L20 8"/><path d="M15 8h5v5"/></svg></span>
    <h1 id="title">myWealth</h1>
    <button type="button" class="icon-btn mask-btn" id="btn-mask" aria-pressed="false" aria-label="Nascondi importi" title="Nascondi importi" hidden>
      <svg class="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="i-eye-off" viewBox="0 0 24 24"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
    </button>
  </header>

  <main class="main">
    <section class="screen" id="screen-pair" hidden></section>
    <section class="screen" id="screen-new" hidden></section>
    <section class="screen" id="screen-list" hidden></section>
    <section class="screen" id="screen-export" hidden></section>
    <section class="screen" id="screen-settings" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sezioni" hidden>
    <button type="button" data-tab="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nuova</span></button>
    <button type="button" data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Voci</span><b class="tab-count" id="pending-count" hidden></b></button>
    <button type="button" data-tab="export"><svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M5 14v5h14v-5"/></svg><span>Esporta</span></button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/></svg><span>Impostazioni</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
