<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mywealth-token" content="__MYWEALTH_TOKEN__">
  <meta name="referrer" content="no-referrer">
  <title>myWealth</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="Navigazione principale">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 17l5-5 3.5 3.5L20 8"/><path d="M15 8h5v5"/></svg>
        </span>
        <span class="brand-name">myWealth</span>
      </div>

      <ul class="nav" id="nav">
        <li><a href="#home" data-view="home" title="Home">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span></a></li>
        <li><a href="#operazioni" data-view="operazioni" title="Operazioni">
          <svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>
          <span>Operazioni</span></a></li>
        <li><a href="#investimenti" data-view="investimenti" title="Investimenti">
          <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 16l4-5 3 3 5-7"/></svg>
          <span>Investimenti</span></a></li>
        <li><a href="#analytics" data-view="analytics" title="Analytics">
          <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
          <span>Analytics</span></a></li>
        <li><a href="#export" data-view="export" title="Export">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          <span>Export</span></a></li>
        <li><a href="#impostazioni" data-view="impostazioni" title="Impostazioni">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/></svg>
          <span>Impostazioni</span></a></li>
      </ul>

      <div class="sidebar-foot">
        <button class="nav-btn nav-badge" id="mobile-badge" type="button" hidden>
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
          <b class="badge-count" id="mobile-badge-count">0</b>
          <span id="mobile-badge-label">File da smartphone</span>
        </button>
        <button class="nav-btn" id="btn-theme" type="button" title="Cambia tema">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <span id="theme-label">Tema</span>
        </button>
        <button class="nav-btn nav-exit" id="btn-exit" type="button" title="Chiudi myWealth">
          <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg>
          <span>Esci</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <div class="banner" id="demo-banner" hidden>Modalità demo · dati sintetici in un database temporaneo, nessuna connessione a internet</div>

      <header class="page-head">
        <div>
          <div class="eyebrow" id="today"></div>
          <h1 id="page-title">Home</h1>
        </div>
        <div class="page-tools">
          <div class="page-actions" id="page-actions"></div>
          <button class="icon-btn bordered mask-btn" id="btn-mask" type="button" aria-pressed="false" title="Nascondi importi (Ctrl+Shift+H)" aria-label="Nascondi importi">
            <svg class="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-eye-off" viewBox="0 0 24 24"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
          </button>
        </div>
      </header>

      <section class="view" data-view="home" id="view-home"></section>
      <section class="view" data-view="operazioni" id="view-operazioni" hidden></section>
      <section class="view" data-view="investimenti" id="view-investimenti" hidden></section>
      <section class="view" data-view="analytics" id="view-analytics" hidden></section>
      <section class="view" data-view="export" id="view-export" hidden></section>
      <section class="view" data-view="impostazioni" id="view-impostazioni" hidden></section>
    </main>
  </div>

  <div class="closed" id="closed" hidden>
    <div class="closed-box">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 17l5-5 3.5 3.5L20 8"/><path d="M15 8h5v5"/></svg>
      </span>
      <h2>myWealth è stato chiuso</h2>
      <p>Puoi chiudere questa finestra.</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
